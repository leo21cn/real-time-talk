# ============================================================
# nginx-gateway 增量配置 — pulan.smartmoves.com.cn (RealTimeTalk)
# ============================================================
# 使用方法: 将以下内容追加到 /root/nginx-smartmoves/nginx.conf
#           在文件末尾最后一个 "}" 之前插入。
# 重载命令: docker service update --force nginx-gateway_nginx
# ============================================================

    # ── pulan.smartmoves.com.cn HTTP → HTTPS redirect ─────────
    server {
        listen 80;
        server_name pulan.smartmoves.com.cn;
        location /.well-known/acme-challenge/ { root /var/www/html; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── pulan.smartmoves.com.cn HTTPS ─────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name pulan.smartmoves.com.cn;

        ssl_certificate     /etc/nginx/certs/pulan.smartmoves.com.cn.crt;
        ssl_certificate_key /etc/nginx/certs/pulan.smartmoves.com.cn.key;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        charset utf-8;

        client_max_body_size 100m;
        client_body_timeout 120s;

        # ── 前端 + API + 静态资源统一代理到 FastAPI ────────────
        location / {
            proxy_pass http://real-time-talk_server:8000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── WebSocket 长连接代理 ───────────────────────────────
        location /ws {
            proxy_pass http://real-time-talk_server:8000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 300s;
        }
    }
