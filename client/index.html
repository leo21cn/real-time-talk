<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端适配：viewport-fit=cover 让 iOS 刘海屏 env(safe-area-inset-*) 生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari: 启用 Web App 模式，链接打开全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 微信内置浏览器：X5 内核视频解码优化 -->
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>普兰 - 项目管理问询助理</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- 微信/QQ/社交分享卡片元数据：微信爬虫优先读取 og:image 作为转发卡片缩略图 -->
    <meta name="description" content="普兰 - 项目管理问询助理，为项目团队提供智能问询与流程协助。" />
    <meta name="keywords" content="普兰,项目管理,智能助理,RAG,问询" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="普兰 - 项目管理问询助理" />
    <meta property="og:description" content="为项目团队提供智能问询与流程协助" />
    <meta property="og:image" content="https://pulan.smartmoves.com.cn/pulan-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://pulan.smartmoves.com.cn/" />
    <meta property="og:site_name" content="普兰" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pulan.smartmoves.com.cn/pulan-logo.png" />
    <meta itemprop="image" content="https://pulan.smartmoves.com.cn/pulan-logo.png" />

    <!-- V2: 预加载最常用的 4 个视频资源，让浏览器在 HTML 解析完成后立即开始 HTTP 拉取。
         微信浏览器首次进页面时即可并行预取，不受 video.play() 需用户交互的限制。
         SW 拦截后这些 preload 请求会被缓存，后续 <video> 元素请求命中 0 网络往返。 -->
    <link rel="preload" as="video" href="/api/clips/idle/idle_breathing.webm?v=10" crossorigin="anonymous">
    <link rel="preload" as="video" href="/api/clips/idle/idle_breathing.mp4?v=10" crossorigin="anonymous">
    <link rel="preload" as="video" href="/api/clips/greeting.webm?v=10" crossorigin="anonymous">
    <link rel="preload" as="video" href="/api/clips/greeting.mp4?v=10" crossorigin="anonymous">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        /* iOS Safari: 防止弹性滚动导致页面被下拉刷新 */
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes typingBounce {
        from { opacity: 0.3; transform: translateY(0); }
        to { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes typingBlink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
